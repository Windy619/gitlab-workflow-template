spec:
  inputs:
    job:
      description: Nom du job. Le changer pour inclure le template une seconde fois (autre suite, autre base).
      default: test_phpunit
      regex: '^test_[a-z0-9_]+$'
    runner:
      description: Lanceur de tests.
      default: phpunit
      options:
        - phpunit
        - pest
    testsuite:
      description: Suite à lancer. Vide pour toutes.
      default: ""
    image:
      description: Image Debian ou Ubuntu dont les paquets fournissent php_version (ubuntu:24.04 pour 8.3, debian:trixie-slim pour 8.4).
      default: ubuntu:24.04
    php_version:
      description: Version de PHP installée en paquets.
      default: "8.3"
      regex: '^8\.[1-9]$'
    php_extensions:
      description: Extensions, installées en paquets php<version>-<extension>.
      default: mbstring xml curl zip intl
    apt_packages:
      description: Paquets système en plus, par exemple les binaires appelés par les tests.
      default: ""
    services:
      description: Services du job, par exemple une base MySQL. Les variables DB_* restent dans le projet.
      type: array
      default: []
---
$[[ inputs.job ]]:
  image: $[[ inputs.image ]]
  stage: test
  needs: []
  services: $[[ inputs.services ]]
  variables:
    DEBIAN_FRONTEND: noninteractive
    COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.composer-cache
    PHP_VERSION: $[[ inputs.php_version ]]
    PHP_EXTENSIONS: $[[ inputs.php_extensions ]]
    APT_PACKAGES: $[[ inputs.apt_packages ]]
    TEST_RUNNER: $[[ inputs.runner ]]
    TESTSUITE: $[[ inputs.testsuite ]]
  cache:
    key:
      prefix: composer
      files:
        - composer.lock
    paths:
      - .composer-cache/
  before_script:
    - apt-get update -qq
    - |
      apt-get install -y -qq --no-install-recommends ca-certificates git unzip composer \
        "php${PHP_VERSION}-cli" $(for e in $PHP_EXTENSIONS; do printf 'php%s-%s ' "$PHP_VERSION" "$e"; done) \
        $APT_PACKAGES >/dev/null
    - php -v
    - composer install --no-interaction --no-progress --prefer-dist
    - |
      if [ -f artisan ]; then
        [ -f .env ] || cp .env.example .env
        php artisan key:generate --force
      fi
    # Le port d'une base de service s'ouvre avant qu'elle accepte les connexions.
    - |
      case "$DB_CONNECTION" in
        mysql) db_port="${DB_PORT:-3306}"; DB_DSN="mysql:host=${DB_HOST};port=${db_port}" ;;
        pgsql) db_port="${DB_PORT:-5432}"; DB_DSN="pgsql:host=${DB_HOST};port=${db_port}${DB_DATABASE:+;dbname=$DB_DATABASE}" ;;
        *) DB_DSN="" ;;
      esac
      if [ -n "$DB_DSN" ]; then
        export DB_DSN
        # PHP CLI écrit ses erreurs sur stdout : tout est redirigé pour ne pas noyer le log.
        deadline=$(( $(date +%s) + 60 ))
        until php -r 'new PDO(getenv("DB_DSN"), getenv("DB_USERNAME"), getenv("DB_PASSWORD"), [PDO::ATTR_TIMEOUT => 2]);' >/dev/null 2>&1; do
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "Base $DB_CONNECTION injoignable sur ${DB_HOST}:${db_port} après 60 s : vérifier le service et les variables DB_*." >&2
            exit 1
          fi
          sleep 2
        done
      fi
  script:
    - vendor/bin/$TEST_RUNNER ${TESTSUITE:+--testsuite="$TESTSUITE"} --log-junit junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
    expire_in: 1 week
