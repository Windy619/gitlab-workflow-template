include:
  - remote: https://gitlab.com/windy6191/gitlab-workflow-template/-/raw/v1.3.0/ci/base.yml
  - remote: https://gitlab.com/windy6191/gitlab-workflow-template/-/raw/v1.3.0/ci/php-quality.yml
    inputs:
      php_version: "8.3"
  - remote: https://gitlab.com/windy6191/gitlab-workflow-template/-/raw/v1.3.0/ci/php-test.yml
    inputs:
      php_version: "8.3"
      services:
        - mysql:8.0
  - remote: https://gitlab.com/windy6191/gitlab-workflow-template/-/raw/v1.3.0/ci/node-build.yml

# Base de test propre au projet, fusionnée avec le job du template.
test_phpunit:
  variables:
    MYSQL_DATABASE: app_test
    MYSQL_ROOT_PASSWORD: root
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: app_test
    DB_USERNAME: root
    DB_PASSWORD: root
