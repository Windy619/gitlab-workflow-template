stages:
  - check

lint:
  stage: check
  image: python:3.12-slim
  script:
    - python -m py_compile setup_gitlab_template.py
    - pip install pyflakes==3.2.0
    - python -m pyflakes setup_gitlab_template.py tests

# 3.7 est le plancher annoncé par le README : le tester évite de le casser sans le voir.
test:
  stage: check
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.7", "3.12"]
  script:
    - pip install -r requirements.txt
    - python -m unittest discover -s tests -v
